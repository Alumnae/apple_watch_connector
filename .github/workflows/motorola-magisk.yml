name: Motorola Magisk build
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/motorola-magisk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.1.0' 'ndk;28.2.13676358'
      - name: Install Rust Android target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android
      - name: Apply narrow experimental Motorola allowance
        shell: python
        run: |
          from pathlib import Path
          p = Path('apple-watch-bridge/hal/src/main/java/dev/applewatchandroid/bridge/RootBluetoothHalHost.java')
          source = p.read_text()
          old = '''if (!"OnePlus".equalsIgnoreCase(Build.MANUFACTURER)
                          || !"CPH2653".equalsIgnoreCase(Build.MODEL)) {'''
          new = '''// Experimental port: no hardware compatibility is implied by admission.
                  // Keep the original CLI target token for protocol compatibility.
                  boolean originalTarget = "OnePlus".equalsIgnoreCase(Build.MANUFACTURER)
                          && "CPH2653".equalsIgnoreCase(Build.MODEL);
                  boolean motorolaTarget = "motorola".equalsIgnoreCase(Build.MANUFACTURER)
                          && ("motorola razr 60 ultra".equalsIgnoreCase(Build.MODEL)
                          || "razr 60 ultra".equalsIgnoreCase(Build.MODEL));
                  if (!originalTarget && !motorolaTarget) {'''
          assert source.count(old) == 1, 'Upstream target guard changed; review required'
          source = source.replace(old, new).replace('This build is fail-closed to OnePlus CPH2653', 'This build allows OnePlus CPH2653 and experimental Motorola razr 60 ultra only')
          assert 'Process.myUid() != 0' in source
          assert 'requireStockBluetoothOff();' in source
          p.write_text(source)
          prop = Path('apple-watch-bridge/tool/magisk_module/module.prop')
          prop.write_text(prop.read_text().replace('name=Apple Watch Bridge built-in Bluetooth HAL', 'name=Apple Watch Bridge experimental Motorola razr 60 ultra'))
          build = Path('apple-watch-bridge/app/build.gradle')
          build.write_text(build.read_text().replace('versionName "0.2.429"', 'versionName "0.2.429-motorola.1"'))
      - name: Test and compile Bridge from source
        working-directory: apple-watch-bridge
        run: bash gradlew --no-daemon :core:test :app:assembleRelease
      - name: Package and verify Magisk archive
        run: |
          mkdir -p dist
          python3 -m unittest discover -s tools -p test_magisk_module.py
          python3 tools/build_magisk_module.py apple-watch-bridge/app/build/outputs/apk/release/app-release.apk dist/apple-watch-bridge-motorola-experimental.zip
          cp apple-watch-bridge/app/build/outputs/apk/release/app-release.apk dist/bridge-motorola-experimental.apk
          git diff --binary > dist/motorola-source.patch
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose --print-certs dist/bridge-motorola-experimental.apk > dist/signature.txt
          sha256sum dist/*.zip dist/*.apk > dist/SHA256SUMS
          cat > dist/LEGGIMI.txt <<'EOF'
          Build sperimentale per Motorola razr 60 ultra: hardware non verificato.
          Il modulo contiene solo Bridge. Companion separato deve avere la stessa firma.
          La firma debug di questa compilazione NON corrisponde alla release upstream.
          Non installare sopra una coppia esistente con firma diversa: servono APK firmati insieme.
          Il decoder ottico e Companion non sono inclusi in questo artefatto.
          Root, Bluetooth stock spento e controlli crittografici restano obbligatori.
          Il token CLI CPH2653 resta interno; i tool di importazione bond/CarPlay non sono portati.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: motorola-magisk-experimental
          path: dist/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-diagnostics
          path: |
            apple-watch-bridge/core/build/reports/tests/
            apple-watch-bridge/**/build/reports/
