name: PIN-only Companion and Magisk build
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/pin-only.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.1.0' 'ndk;28.2.13676358'
      - name: Install Rust Android target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
      - name: Prepare PIN-only Companion
        shell: python
        run: |
          from pathlib import Path
          root = Path('apple-watch-companion')
          p = root / 'android/app/build.gradle.kts'
          s = p.read_text()
          s = s.replace('android {\n', 'val pinOnly = providers.gradleProperty("pinOnly").orNull == "true"\n\nandroid {\n', 1)
          s = s.replace('buildConfigField("boolean", "NATIVE_FACE_PROFILE_ISOLATED", "false")', 'buildConfigField("boolean", "NATIVE_FACE_PROFILE_ISOLATED", "false")\n        buildConfigField("boolean", "PIN_ONLY", pinOnly.toString())')
          s = s.replace('externalNativeBuild { cmake { cppFlags += "-O2" } }', 'externalNativeBuild { cmake {\n            cppFlags += "-O2"\n            arguments += "-DWATCH_PIN_ONLY=${if (pinOnly) "ON" else "OFF"}"\n        } }')
          a = s.index('val opticalRepository =')
          b = s.index('\nflutter {', a)
          s = s[:a] + 'if (!pinOnly) {\n' + s[a:b] + '\n}\n' + s[b:]
          p.write_text(s)
          p = root / 'android/app/src/main/cpp/CMakeLists.txt'
          s = p.read_text().replace('if(ANDROID_ABI STREQUAL "arm64-v8a")', 'option(WATCH_PIN_ONLY "Build without proprietary optical decoder" OFF)\nif(ANDROID_ABI STREQUAL "arm64-v8a" AND NOT WATCH_PIN_ONLY)')
          p.write_text(s)
          p = root / 'lib/services/companion_platform.dart'
          s = p.read_text().replace('    opticalPairing: true,', "    opticalPairing: !bool.fromEnvironment('PIN_ONLY'),")
          p.write_text(s)
          p = root / 'lib/screens/connection/watch_connection_screen.dart'
          s = p.read_text().replace('if (connection.platform.codeOnlyPairing && state.pairingAvailable)', 'if (!connection.platform.opticalPairing && state.pairingAvailable)')
          p.write_text(s)
          p = root / 'android/app/src/main/kotlin/dev/applewatchandroid/companion/apple_watch_companion/CompanionFlutterBridge.kt'
          s = p.read_text().replace('        val opticalResult = object : BridgeResult {', '''        if (BuildConfig.PIN_ONLY && call.method in setOf(
                          "startOpticalDecoder", "processOpticalFrame", "beginOpticalPairing", "replacePairOptically")) {
                      result.error("OPTICAL_UNAVAILABLE", "This build supports pairing by PIN only", null)
                      return
                  }
                  val opticalResult = object : BridgeResult {''')
          p.write_text(s)
          print('PIN-only build mode prepared; Android permission flow retained.')
          
          p = root / 'test/watch_connection_test.dart'
          s = p.read_text().replace("expect(find.text('Pair with Camera'), findsOneWidget);", "expect(find.text('Pair with Camera'), const bool.fromEnvironment('PIN_ONLY') ? findsNothing : findsOneWidget);\n      if (const bool.fromEnvironment('PIN_ONLY')) {\n        expect(await connection.pairOptically(token, previousPair: null), 'REJECTED');\n        expect(transport.requests, isEmpty);\n      }")
          p.write_text(s)
      - name: Remove Bluetooth host manufacturer and model restriction
        shell: python
        run: |
          from pathlib import Path
          p = Path('apple-watch-bridge/hal/src/main/java/dev/applewatchandroid/bridge/RootBluetoothHalHost.java')
          source = p.read_text()
          old = '''if (!"OnePlus".equalsIgnoreCase(Build.MANUFACTURER)
                          || !"CPH2653".equalsIgnoreCase(Build.MODEL)) {
                      throw new HostException(
                              "This build is fail-closed to OnePlus CPH2653");
                  }'''
          if source.count(old) == 1:
              source = source.replace(old, '// Hardware model restriction removed at owner request; compatibility remains unverified.')
          else:
              assert 'Hardware model restriction removed at owner request' in source, 'Unexpected target policy; review required'
          assert 'Process.myUid() != 0' in source
          assert 'requireStockBluetoothOff();' in source
          p.write_text(source)
          prop = Path('apple-watch-bridge/tool/magisk_module/module.prop')
          prop.write_text(prop.read_text().replace('name=Apple Watch Bridge built-in Bluetooth HAL', 'name=Apple Watch Bridge experimental Motorola razr 60 ultra'))
          build = Path('apple-watch-bridge/app/build.gradle')
          build.write_text(build.read_text().replace('versionCode 629', 'versionCode 630').replace('versionName "0.2.429"', 'versionName "0.2.429-pin.2"'))
      - name: Test and compile Bridge from source
        working-directory: apple-watch-bridge
        run: AR_aarch64_linux_android="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" bash gradlew --no-daemon :core:test :app:assembleRelease
      - name: Test and build PIN-only Companion
        working-directory: apple-watch-companion
        env:
          ORG_GRADLE_PROJECT_pinOnly: 'true'
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test test/watch_connection_test.dart
          flutter test test/watch_connection_test.dart --dart-define=PIN_ONLY=true --plain-name 'Empty store offers real camera recognition and PIN fallback without a fake model'
          flutter build apk --release --target-platform android-arm64 --dart-define=PIN_ONLY=true --build-name=1.0.87 --build-number=88
      - name: Package and verify Magisk archive
        run: |
          mkdir -p dist
          python3 -m unittest discover -s tools -p test_magisk_module.py
          python3 tools/build_magisk_module.py apple-watch-bridge/app/build/outputs/apk/release/app-release.apk dist/apple-watch-bridge-pin-only.zip
          cp apple-watch-bridge/app/build/outputs/apk/release/app-release.apk dist/bridge-pin-only.apk
          cp apple-watch-companion/build/app/outputs/flutter-apk/app-release.apk dist/companion-pin-only.apk
          git diff --binary > dist/motorola-source.patch
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose --print-certs dist/bridge-pin-only.apk > dist/signature.txt
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --print-certs dist/companion-pin-only.apk > dist/companion-signature.txt
          bridge_cert=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' dist/signature.txt)
          companion_cert=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' dist/companion-signature.txt)
          test -n "$bridge_cert"
          test "$bridge_cert" = "$companion_cert"
          sha256sum dist/*.zip dist/*.apk > dist/SHA256SUMS
          cat > dist/LEGGIMI.txt <<'EOF'
          Variante sperimentale con abbinamento PIN. Scansione ottica disabilitata.
          Modulo Magisk Bridge e APK Companion sono firmati con lo stesso certificato.
          Sostituire entrambi i vecchi pacchetti: la firma delle build precedenti è diversa.
          La rimozione di un'app o dei suoi dati elimina l'eventuale coppia salvata.
          Nessun controllo produttore/modello nel backend principale. Hardware Motorola non verificato.
          Aprire Companion, concedere i permessi Bluetooth, aprire Tutti gli orologi,
          selezionare l'orologio e inserire il codice di abbinamento mostrato sul Watch.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: pin-only-companion-and-magisk
          path: dist/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-diagnostics
          path: |
            apple-watch-bridge/core/build/reports/tests/
            apple-watch-bridge/**/build/reports/
            apple-watch-companion/build/app/outputs/logs/
